name: Build & publish verified binaries

on:
  workflow_dispatch: {}
  schedule:
    # Once a day. Cheap no-op if the source repo's HEAD hasn't moved since the
    # last published build (checked in the "skip if already built" step below).
    - cron: '17 6 * * *'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Asevoxel-Dev source
        uses: actions/checkout@v4
        with:
          repository: matiasman1/Asevoxel-Dev
          path: source
          fetch-depth: 1

      - name: Resolve source commit and skip if already built
        id: rev
        shell: bash
        run: |
          cd source
          sha=$(git rev-parse HEAD)
          short=${sha:0:12}
          version=$(grep -oP '"version":\s*"\K[^"]+' package.json || echo "unknown")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="build-$short"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup MSYS2 (UCRT64)
        if: steps.rev.outputs.already_built == 'false'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-opencl-icd

      - name: Build asevoxel_compute.exe (OpenCL compute binary)
        if: steps.rev.outputs.already_built == 'false'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p source/bin
          cd source
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Isrc -I/ucrt64/include \
            -o bin/asevoxel_compute.exe \
            src/asevoxel_compute.cpp src/opencl_init.cpp src/io_pipeline.cpp \
            src/render_gpu.cpp src/daemon.cpp src/ws_server.cpp \
            -Wl,-Bstatic -lpthread -Wl,-Bdynamic -lOpenCL -lws2_32
          cp /ucrt64/bin/libwinpthread-1.dll bin/ || true

      - name: Build asevoxel_native.dll (Lua native bridge)
        if: steps.rev.outputs.already_built == 'false'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p source/render/bin
          cd source
          g++ -O2 -std=c++17 -shared -static -static-libgcc -static-libstdc++ -fopenmp \
            -o render/bin/asevoxel_native.dll asevoxel_native.cpp \
            -I/ucrt64/include -llua -lpthread -lgomp

      - name: Checksum binaries
        if: steps.rev.outputs.already_built == 'false'
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp source/bin/asevoxel_compute.exe out/
          cp source/render/bin/asevoxel_native.dll out/
          [ -f source/bin/libwinpthread-1.dll ] && cp source/bin/libwinpthread-1.dll out/ || true
          cd out
          sha256sum * > CHECKSUMS.sha256
          cat CHECKSUMS.sha256

      - name: Attest build provenance
        if: steps.rev.outputs.already_built == 'false'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            out/asevoxel_compute.exe
            out/asevoxel_native.dll

      - name: Publish release
        if: steps.rev.outputs.already_built == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > out/NOTES.md <<EOF
          Independently built from [matiasman1/Asevoxel-Dev@${{ steps.rev.outputs.sha }}](https://github.com/matiasman1/Asevoxel-Dev/commit/${{ steps.rev.outputs.sha }}).

          package.json version at build time: ${{ steps.rev.outputs.version }}

          Built on a clean GitHub-hosted \`windows-latest\` runner using the exact
          MSYS2/g++ commands from Asevoxel-Dev's \`create_extension.ps1\`, with no
          local/manual toolchain state. See CHECKSUMS.sha256 for SHA-256 hashes of
          every published file, and the "Attestations" tab on this release for a
          signed provenance record tying these exact bytes back to this exact
          workflow run and source commit.
          EOF
          gh release create "${{ steps.rev.outputs.tag }}" \
            out/asevoxel_compute.exe out/asevoxel_native.dll out/CHECKSUMS.sha256 \
            $( [ -f out/libwinpthread-1.dll ] && echo out/libwinpthread-1.dll ) \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build ${{ steps.rev.outputs.short }} (v${{ steps.rev.outputs.version }})" \
            --notes-file out/NOTES.md
