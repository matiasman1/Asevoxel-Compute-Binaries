name: Build & publish verified binaries

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'source/**'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (mirrored source)
        uses: actions/checkout@v4

      - name: Resolve source revision and skip if already built
        id: rev
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          short=${sha:0:12}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          tag="build-$short"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup MSYS2 (UCRT64)
        if: steps.rev.outputs.already_built == 'false'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-opencl-icd

      - name: Build asevoxel_compute.exe (OpenCL compute binary)
        if: steps.rev.outputs.already_built == 'false'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p bin
          g++ -O2 -std=c++17 -static-libgcc -static-libstdc++ \
            -Isource/src -I/ucrt64/include \
            -o bin/asevoxel_compute.exe \
            source/src/asevoxel_compute.cpp source/src/opencl_init.cpp source/src/io_pipeline.cpp \
            source/src/render_gpu.cpp source/src/daemon.cpp source/src/ws_server.cpp \
            -Wl,-Bstatic -lpthread -Wl,-Bdynamic -lOpenCL -lws2_32
          cp /ucrt64/bin/libwinpthread-1.dll bin/ || true

      - name: Build asevoxel_native.dll (Lua native bridge)
        if: steps.rev.outputs.already_built == 'false'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p render_bin
          g++ -O2 -std=c++17 -shared -static -static-libgcc -static-libstdc++ -fopenmp \
            -o render_bin/asevoxel_native.dll source/asevoxel_native.cpp \
            -I/ucrt64/include -llua -lpthread -lgomp

      - name: Checksum binaries
        if: steps.rev.outputs.already_built == 'false'
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp bin/asevoxel_compute.exe out/
          cp render_bin/asevoxel_native.dll out/
          [ -f bin/libwinpthread-1.dll ] && cp bin/libwinpthread-1.dll out/ || true
          cd out
          sha256sum * > CHECKSUMS.sha256
          cat CHECKSUMS.sha256

      - name: Attest build provenance
        if: steps.rev.outputs.already_built == 'false'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            out/asevoxel_compute.exe
            out/asevoxel_native.dll

      - name: Publish release
        if: steps.rev.outputs.already_built == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > out/NOTES.md <<EOF
          Built from this repo's mirrored source at commit
          [${{ steps.rev.outputs.sha }}](https://github.com/${{ github.repository }}/tree/${{ steps.rev.outputs.sha }}/source)
          (see \`source/MIRROR_INFO.md\` for which Asevoxel-Dev commit that
          mirrors).

          Built on a clean GitHub-hosted \`windows-latest\` runner using the
          exact MSYS2/g++ commands Asevoxel-Dev's \`create_extension.ps1\`
          uses locally. See CHECKSUMS.sha256 for SHA-256 hashes of every
          published file, and the "Attestations" tab on this release for a
          signed provenance record tying these exact bytes back to this
          exact workflow run and source commit.
          EOF
          gh release create "${{ steps.rev.outputs.tag }}" \
            out/asevoxel_compute.exe out/asevoxel_native.dll out/CHECKSUMS.sha256 \
            $( [ -f out/libwinpthread-1.dll ] && echo out/libwinpthread-1.dll ) \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build ${{ steps.rev.outputs.short }}" \
            --notes-file out/NOTES.md
